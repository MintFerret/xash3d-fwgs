name: Build Xash3D Wii (ref-gx)

on:
  push:
    branches:
      - ref-gx
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect libogc Nunchuk and IR
        run: |
          HEADER="$DEVKITPRO/libogc/include/wiiuse/wpad.h"
          INCLUDE="$DEVKITPRO/libogc/include"

          echo "=== WPAD HEADER: 1-175 ==="
          sed -n '1,175p' "$HEADER"

          echo "=== IR STRUCTURE ==="
          grep -R -n -A35 -B5 'struct ir_t' "$INCLUDE/wiiuse" --include='*.h'

          echo "=== EXPANSION STRUCTURE ==="
          grep -R -n -A60 -B5 'struct expansion_t' "$INCLUDE/wiiuse" --include='*.h'

          echo "=== NUNCHUK STRUCTURE ==="
          grep -R -n -A40 -B5 'struct nunchuk_t' "$INCLUDE/wiiuse" --include='*.h'

      - name: Inspect Wii input structures
        run: |
          HEADER="$DEVKITPRO/libogc/include/wiiuse/wiiuse.h"

          echo "=== JOYSTICK STRUCTURE ==="
          sed -n '424,470p' "$HEADER"

          echo "=== EXPANSION STRUCTURE ==="
          sed -n '545,562p' "$HEADER"

          echo "=== WPAD DATA FORMAT ==="
          grep -n -A15 -B5 'WPAD_SetDataFormat' "$DEVKITPRO/libogc/include/wiiuse/wpad.h"

      - name: Clone hlsdk-portable with submodules
        run: |
          git clone --recursive https://github.com/Gerardo-Hub17/hlsdk-portable.git "$GITHUB_WORKSPACE/../hlsdk-portable"

      - name: Clone mainui_cpp with submodules
        run: |
          git clone --recursive https://github.com/Gerardo-Hub17/mainui_cpp.git "$GITHUB_WORKSPACE/../mainui_cpp"

      - name: Verify cloned directories
        run: |
          echo "=== hlsdk-portable check ==="
          ls "$GITHUB_WORKSPACE/../hlsdk-portable/cl_dll/ev_hldm.cpp" 2>&1 || echo "MISSING ev_hldm.cpp"
          echo "=== mainui_cpp check ==="
          ls "$GITHUB_WORKSPACE/../mainui_cpp/link_helper.cpp" 2>&1 || echo "MISSING link_helper.cpp"
          echo "=== miniutl check (dependencies de mainui_cpp) ==="
          ls "$GITHUB_WORKSPACE/../mainui_cpp/miniutl/" 2>&1 | head -5 || echo "MISSING miniutl"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake git build-essential

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Wii.cmake \
            -DXASH_RENDERER=ref_gx \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Find generated files
        run: |
          echo "=== Generated ELF/DOL files ==="
          find build -type f \( -name "*.dol" -o -name "*.elf" \) -print

      - name: Resolve DSI Crash Addresses


        run: |


          ELF_PATH=$(find . -name "*.elf" | head -n 1)


          if [ -z "$ELF_PATH" ]; then echo "No elf found"; exit 1; fi


          echo "Analizando: $ELF_PATH"


          # Buscar addr2line en las carpetas de devkitPro


          ADDR2LINE=$(find /opt/devkitpro /usr -name "powerpc-eabi-addr2line" 2>/dev/null | head -n 1)


          if [ -z "$ADDR2LINE" ]; then echo "No se encontró addr2line"; exit 1; fi


          echo "Usando: $ADDR2LINE"


          $ADDR2LINE -e "$ELF_PATH" -f -C 0x8046C348 0x8046C394 0x800c8fa4 0x8007a7d8 0x800e9898 0x80100c30 0x800f2284 0x80085e28 0x800851ec 0x800044ac




      - name: Resolve Wii crash addresses
        run: |
          echo "=== DEVKITPRO ==="
          echo "$DEVKITPRO"
          echo "=== DEVKITPPC ==="
          echo "$DEVKITPPC"

          echo "=== Searching addr2line ==="
          find "$DEVKITPRO" -type f -name "powerpc-eabi-addr2line" -print

          ADDR2LINE=$(find "$DEVKITPRO" -type f -name "powerpc-eabi-addr2line" -print -quit)

          if [ -z "$ADDR2LINE" ]; then
            echo "ERROR: powerpc-eabi-addr2line not found"
            echo "=== PowerPC tools found ==="
            find "$DEVKITPRO" -type f -name "powerpc-eabi-*" -print | head -50
            exit 1
          fi

          echo "Using: $ADDR2LINE"
          "$ADDR2LINE" --version || true

          echo "=== Resolving crash addresses ==="
          for elf in $(find build -type f -name "*.elf"); do
            echo "========================================"
            echo "ELF: $elf"
            echo "========================================"

            ADDRS=$(grep -v '^#' crash_addrs.txt | tr -s ' \n' ' ')
            echo "Addresses: $ADDRS"
            "$ADDR2LINE" -f -C -e "$elf" $ADDRS
            # addr2line solo entiende codigo. Para direcciones de datos (p. ej. la
            # KTickTask corrupta en r3) buscamos el simbolo anterior con nm.
            BIN=$(dirname "$ADDR2LINE")
            echo "=== Simbolo mas cercano (nm) ==="
            "$BIN/powerpc-eabi-nm" -n -S -C "$elf" | awk -v list="$ADDRS" '
              function h(s,  i,c,v){ v=0; s=tolower(s); sub(/^0x/,"",s);
                for(i=1;i<=length(s);i++){ c=index("0123456789abcdef",substr(s,i,1))-1; v=v*16+c } return v }
              BEGIN{ n=split(list,A," "); for(i=1;i<=n;i++){ T[i]=h(A[i]); B[i]=-1 } }
              { if(NF<3) next; v=h($1);
                for(i=1;i<=n;i++){
                  if(v<=T[i] && v>=B[i]){ B[i]=v; L[i]=$0 }
                  else if(v>T[i] && !(i in NX)){ NX[i]=$0 } } }
              END{ for(i=1;i<=n;i++) printf "%s -> %s  | siguiente: %s\n", A[i], L[i], NX[i] }'

            echo "=== Secciones (objdump -h) ==="
            "$BIN/powerpc-eabi-objdump" -h "$elf" | grep -E "\.(text|data|bss|sbss|sdata|stack|heap)|Idx" || true
            echo "=== Simbolos de stack/heap ==="
            "$BIN/powerpc-eabi-nm" -n -C "$elf" | grep -iE "stack|__bss|_end$|__heap|arena" | head -30 || true
          done

      - name: Upload Wii build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xash-wii-ref-gx-debug
          path: |
            build/**/*.dol
            build/**/*.elf
          if-no-files-found: warn
          retention-days: 30
